<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roy Tan — Fine Art</title>
<meta name="description" content="Paintings by Roy Tan. A new portfolio is on its way.">
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #faf7f2;
    color: #23201c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    width: 100%;
    max-width: 880px;
    padding: 56px 24px 40px;
    text-align: center;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .rule {
    width: 64px; height: 2px;
    background: #b08d4f;
    margin: 22px auto 26px;
  }
  .tagline {
    font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.2rem);
    color: #5c554b;
    max-width: 560px;
    margin: 0 auto 36px;
    line-height: 1.55;
  }
  figure { margin: 0 auto 36px; max-width: 760px; }
  figure img {
    width: 100%; height: auto; display: block;
    box-shadow: 0 10px 40px rgba(35, 32, 28, 0.18);
  }
  figcaption {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #7a7264;
    font-style: italic;
  }
  .notice {
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    margin-bottom: 14px;
  }
  .contact { font-size: 1rem; color: #5c554b; line-height: 1.6; }
  .contact a {
    color: #8a6d35;
    text-decoration: none;
    border-bottom: 1px solid #cbb27f;
  }
  .contact a:hover { color: #6d5527; }
  footer {
    margin-top: auto;
    padding: 24px;
    font-size: 0.85rem;
    color: #9a917f;
  }
</style>
</head>
<body>
  <main>
    <h1>ROY TAN</h1>
    <div class="rule"></div>
    <p class="tagline">Paintings in acrylic — landscapes, still lifes, and city scenes,
      made since a community-college painting class turned into a lasting obsession.</p>
    <figure>
      <img src="hero.jpg" alt="Taipei Night Market — acrylic painting by Roy Tan">
      <figcaption>Taipei Night Market, acrylic, 20 × 16</figcaption>
    </figure>
    <p class="notice">A new portfolio is on its way.</p>
    <p class="contact">Until then, find recent work and get in touch on Instagram:
      <a href="https://www.instagram.com/roytan.art/">@roytan.art</a></p>
  </main>
  <footer>© Roy Tan</footer>
</body>
</html>
